<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Black background -->
  <rect width="1024" height="1024" rx="180" fill="#000000"/>

  <!--
    4×4 step-sequencer beat grid.
    Cell size: 168 px   Gap: 40 px
    Grid width/height: 4×168 + 3×40 = 792 px
    Origin: (1024 − 792) / 2 = 116 px

    Beat pattern (■ = active / white, □ = rest / black):
      row 0:  ■ □ ■ □
      row 1:  □ ■ □ □
      row 2:  ■ □ □ ■
      row 3:  □ □ ■ □
  -->

  <!-- row 0  (y = 116) -->
  <rect x="116" y="116" width="168" height="168" fill="#ffffff"/>
  <rect x="532" y="116" width="168" height="168" fill="#ffffff"/>

  <!-- row 1  (y = 324) -->
  <rect x="324" y="324" width="168" height="168" fill="#ffffff"/>

  <!-- row 2  (y = 532) -->
  <rect x="116" y="532" width="168" height="168" fill="#ffffff"/>
  <rect x="740" y="532" width="168" height="168" fill="#ffffff"/>

  <!-- row 3  (y = 740) -->
  <rect x="532" y="740" width="168" height="168" fill="#ffffff"/>
</svg>
